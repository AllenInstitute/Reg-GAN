[project]
name = "reg-gan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "albumentations>=2.0.8",
    "click>=8.3.1",
    "loguru>=0.7.3",
    "matplotlib>=3.10.9",
    "numpy>=2.3.5",
    "opencv-python-headless>=4.13.0.92",
    "lightning>=2.6.0",
    "pandas>=2.3.0",
    "pillow>=12.0.0",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scipy>=1.16.3",
    "segmentation-models-pytorch>=0.5.0",
    "tifffile>=2026.5.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.1",
    "transformers>=5.9.0",
    "wandb>=0.26.1",
]

[project.scripts]
reg-gan-train = "train:main"
reg-gan-generate-masks = "scripts.generate_masks:cli"
reg-gan-split-train-val = "scripts.split_train_val:main"
reg-gan-train-segmentation = "scripts.train_segmentation_model:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["train"]
packages = ["Model", "trainer", "scripts"]
