#####
name: CycleGan
bidirect: True #Unidirectional or bidirectional
regist: False    # With or without registration network
noise_level: 0  #  noise level
port: 6019   #  port parameters
save_root: '/results/Cyc/C/'
image_save: '/results/Cyc/C/img/'

# lamda weight
Adv_lamda: 1
Cyc_lamda: 10
Mask_lamda: 1


epoch: 0        # starting epoch
n_epochs: 200       # How often do you want to display output images during training
batchSize: 1               # size of the batches
dataroot: '/results/train'     # root directory of the dataset
val_dataroot: '/results/val'
lr: 0.0002                   # initial learning rate
decay_epoch: 20            # epoch to start linearly decaying the learning rate to 0
size: 512                # size of the data crop
input_nc: 1         
output_nc: 1                  
cuda: True                
n_cpu: 8

use_wandb: true
wandb_project: reg-gan-FISH
wandb_entity: knowledge-engineering
